apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-identity
  template:
    metadata:
      labels:
        app: crapi-identity
    spec:
      initContainers:
        - name: wait-for-postgres
          image: groundnuty/k8s-wait-for:v1.3
          imagePullPolicy: Always
          args:
            - "service"
            - "postgresdb"
      containers:
        - name: crapi-identity
          image: crapi/crapi-identity:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 8080
          envFrom:
              - configMapRef:
                  name: crapi-identity-configmap
          env:
            - name: JWKS
              valueFrom:
                secretKeyRef:
                  name: jwt-signing-keys
                  key: JWKS
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crapi-credentials
                  key: DB_PASSWORD
            - name: API_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crapi-credentials
                  key: API_GATEWAY_PASSWORD
            - name: TLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crapi-credentials
                  key: TLS_KEYSTORE_PASSWORD
                  optional: true
            - name: TLS_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crapi-credentials
                  key: TLS_KEY_PASSWORD
                  optional: true
          resources:
            limits:
              cpu: "500m"
            requests:
              cpu: 256m
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

