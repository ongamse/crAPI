apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-web
  template:
    metadata:
      labels:
        app: crapi-web
    spec:
      # allowPrivilegeEscalation=false sets no_new_privs, so the file capability
      # (cap_net_bind_service) on the openresty binary no longer takes effect for
      # the non-root user. Lower the unprivileged port floor for this pod's
      # network namespace so nginx can still bind ports 80/443. This sysctl is in
      # the Kubernetes "safe" set (>= v1.22).
      securityContext:
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: crapi-web
        image: crapi/crapi-web:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
          requests:
            cpu: 256m
        envFrom:
          - configMapRef:
              name: crapi-web-configmap