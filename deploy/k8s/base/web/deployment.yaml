apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-web
  template:
    metadata:
      labels:
        app: crapi-web
    spec:
      securityContext:
        # allowPrivilegeEscalation=false (no_new_privs) disables the file
        # capability on nginx, so let the non-root user bind ports 80/443.
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: crapi-web
        image: crapi/crapi-web:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "500m"
          requests:
            cpu: 256m
        envFrom:
          - configMapRef:
              name: crapi-web-configmap