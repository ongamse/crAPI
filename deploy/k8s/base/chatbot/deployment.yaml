apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-chatbot
  template:
    metadata:
      labels:
        app: crapi-chatbot
    spec:
      containers:
      - name: crapi-chatbot
        image: crapi/crapi-chatbot:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5002
        envFrom:
            - configMapRef:
                name: crapi-chatbot-configmap
        env:
        # Secret is created out of band by operators; never commit its value.
        - name: MONGO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crapi-chatbot-secret
              key: MONGO_DB_PASSWORD
        resources:
          limits:
            cpu: "500m"
          requests:
            cpu: 256m
