apiVersion: v1
kind: ConfigMap
metadata:
  name: crapi-workshop-configmap
  labels:
    app: crapi-workshop
data:
    IDENTITY_SERVICE: crapi-identity:8080
    # SECRET_KEY, DB_PASSWORD, MONGO_DB_PASSWORD and API_GATEWAY_PASSWORD are injected from Secrets (see deployment.yaml)
    DB_HOST: postgresdb
    DB_USER: admin
    DB_NAME: crapi
    DB_PORT: "5432"
    MONGO_DB_HOST: mongodb
    MONGO_DB_PORT: "27017"
    MONGO_DB_USER: admin
    MONGO_DB_NAME: crapi
    SERVER_PORT: "8000"
    ALLOWED_HOSTS: "localhost,127.0.0.1,[::1],crapi-workshop"
    CORS_ALLOWED_ORIGINS: "http://localhost:8888,https://localhost:8443,http://127.0.0.1:8888,https://127.0.0.1:8443"
