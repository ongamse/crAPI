apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.name }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
data:
  DB_PASSWORD: {{ include "crapi.credential" (dict "ctx" . "key" "DB_PASSWORD" "value" .Values.postgresdb.config.postgresPassword) }}
  MONGO_DB_PASSWORD: {{ include "crapi.credential" (dict "ctx" . "key" "MONGO_DB_PASSWORD" "value" .Values.mongodb.config.mongoPassword) }}
  SECRET_KEY: {{ include "crapi.credential" (dict "ctx" . "key" "SECRET_KEY" "value" .Values.workshop.config.secretKey) }}
  API_GATEWAY_PASSWORD: {{ include "crapi.credential" (dict "ctx" . "key" "API_GATEWAY_PASSWORD" "value" .Values.apiGatewayPassword) }}
  {{- with .Values.identity.config.keyStorePassword }}
  TLS_KEYSTORE_PASSWORD: {{ . | toString | b64enc }}
  {{- end }}
  {{- with .Values.identity.config.keyPassword }}
  TLS_KEY_PASSWORD: {{ . | toString | b64enc }}
  {{- end }}
  {{- with .Values.chatbot.config.apiPassword }}
  API_PASSWORD: {{ . | toString | b64enc }}
  {{- end }}
