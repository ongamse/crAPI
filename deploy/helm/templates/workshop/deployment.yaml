apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.workshop.name }}
  labels:
    release: {{ .Release.Name }}
    {{- with .Values.workshop.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.workshop.replicaCount }}
  selector:
    matchLabels:
      {{- toYaml .Values.workshop.deploymentSelectorMatchLabels | nindent 6 }}
  template:
    metadata:
      labels:
        release: {{ .Release.Name }}
        {{- with .Values.workshop.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.waitForK8sResources.enabled }}
      initContainers:
        - name: wait-for-crapi-identity
          image: {{ .Values.waitForK8sResources.image }}
          imagePullPolicy: {{ .Values.waitForK8sResources.imagePullPolicy }}
          args:
            - "service"
            - {{ .Values.identity.service.name | quote }}
        - name: wait-for-crapi-community
          image: {{ .Values.waitForK8sResources.image }}
          imagePullPolicy: {{ .Values.waitForK8sResources.imagePullPolicy }}
          args:
            - "service"
            - {{ .Values.community.service.name | quote }}
      {{- end }}
      containers:
        - name: {{ .Values.workshop.name }}
          image: {{ .Values.workshop.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.workshop.port }}
          envFrom:
            - configMapRef:
                name: {{ .Values.workshop.config.name }}
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: DB_PASSWORD
            - name: MONGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: MONGO_DB_PASSWORD
            - name: API_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: API_GATEWAY_PASSWORD
          {{- if and .Values.tlsEnabled .Values.tlsSecretName }}
            - name: TLS_CERTIFICATE
              value: /app/tls/server.crt
            - name: TLS_KEY
              value: /app/tls/server.key
          {{- end }}
          {{- if .Values.workshop.resources }}
          resources:
            {{- toYaml .Values.workshop.resources | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.workshop.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- if and .Values.tlsEnabled .Values.tlsSecretName }}
          volumeMounts:
            - name: tls
              mountPath: /app/tls
              readOnly: true
          {{- end }}
      {{- if and .Values.tlsEnabled .Values.tlsSecretName }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tlsSecretName }}
      {{- end }}
