apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.mailhog.config.name }}
  labels:
    release: {{ .Release.Name }}
    {{- toYaml .Values.mailhog.config.labels | nindent 4 }}
data:
  MH_MONGO_URI: {{ printf "%s:%s@%s:%v" .Values.mongodb.config.mongoUser (required "mongodb.config.mongoPassword is required" .Values.mongodb.config.mongoPassword | urlquery) .Values.mongodb.service.name .Values.mongodb.port | quote }}
  MH_STORAGE: {{ .Values.mailhog.config.mailhogStorage }}
