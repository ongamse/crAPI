{{- /*
Credentials shared by the crAPI services. Nothing is stored in values.yaml:
set the values below with --set / a private values file, or leave them empty
to have random ones generated on first install (an existing secret is reused
on upgrade so database passwords keep matching the stored data).
Values must be URL-safe because the MongoDB password is embedded in a URI.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name)).data | default dict }}
{{- $pg := .Values.postgresdb.config.postgresPassword | default (index $existing "POSTGRES_PASSWORD" | default "" | b64dec) | default (randAlphaNum 24) }}
{{- $mongo := .Values.mongodb.config.mongoPassword | default (index $existing "MONGO_INITDB_ROOT_PASSWORD" | default "" | b64dec) | default (randAlphaNum 24) }}
{{- $secretKey := .Values.workshop.config.secretKey | default (index $existing "SECRET_KEY" | default "" | b64dec) | default (randAlphaNum 32) }}
{{- $gw := .Values.apiGatewayPassword | default (index $existing "API_GATEWAY_PASSWORD" | default "" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pg | quote }}
  DB_PASSWORD: {{ $pg | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ $mongo | quote }}
  MONGO_DB_PASSWORD: {{ $mongo | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
  API_GATEWAY_PASSWORD: {{ $gw | quote }}
