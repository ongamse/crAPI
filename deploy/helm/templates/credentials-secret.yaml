{{- if not .Values.credentials.existingSecret }}
{{- /*
Each value is resolved in this order:
  1. explicit --set credentials.<name>=... (plain text, base64-encoded here)
  2. the value already stored in the cluster Secret (kept as-is so upgrades never rotate
     a password that an existing database volume depends on)
  3. a freshly generated random value
*/}}
{{- $name := include "crapi.credentialsSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $c := .Values.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
data:
  DB_PASSWORD: {{ if $c.dbPassword }}{{ $c.dbPassword | b64enc }}{{ else }}{{ get $data "DB_PASSWORD" | default (randAlphaNum 24 | b64enc) }}{{ end }}
  MONGO_DB_PASSWORD: {{ if $c.mongoPassword }}{{ $c.mongoPassword | b64enc }}{{ else }}{{ get $data "MONGO_DB_PASSWORD" | default (randAlphaNum 24 | b64enc) }}{{ end }}
  SECRET_KEY: {{ if $c.workshopSecretKey }}{{ $c.workshopSecretKey | b64enc }}{{ else }}{{ get $data "SECRET_KEY" | default (randAlphaNum 32 | b64enc) }}{{ end }}
  API_GATEWAY_PASSWORD: {{ if $c.apiGatewayPassword }}{{ $c.apiGatewayPassword | b64enc }}{{ else }}{{ get $data "API_GATEWAY_PASSWORD" | default (randAlphaNum 24 | b64enc) }}{{ end }}
  SMTP_PASS: {{ if $c.smtpPass }}{{ $c.smtpPass | b64enc }}{{ else }}{{ get $data "SMTP_PASS" | default ("" | b64enc) }}{{ end }}
{{- end }}
