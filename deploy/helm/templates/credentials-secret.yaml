{{- /*
Credentials for crAPI workloads. Nothing sensitive is stored in values.yaml:
set values under `credentials.*` at install time (e.g. --set or a private
values file) or leave them empty to have random values generated once and
reused on upgrade.
*/ -}}
{{- define "crapi.pick" -}}
{{- $given := index . 0 -}}
{{- $old := index . 1 -}}
{{- $key := index . 2 -}}
{{- $len := index . 3 -}}
{{- if $given -}}
{{- $given -}}
{{- else if hasKey $old $key -}}
{{- index $old $key | b64dec -}}
{{- else -}}
{{- randAlphaNum $len -}}
{{- end -}}
{{- end -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.credentials.secretName) | default dict }}
{{- $old := (get $existing "data") | default dict }}
{{- $dbPassword := include "crapi.pick" (list .Values.credentials.postgresPassword $old "DB_PASSWORD" 24) }}
{{- $mongoPassword := include "crapi.pick" (list .Values.credentials.mongoPassword $old "MONGO_DB_PASSWORD" 24) }}
{{- $jwtSecret := include "crapi.pick" (list .Values.credentials.jwtSecret $old "JWT_SECRET" 48) }}
{{- $secretKey := include "crapi.pick" (list .Values.credentials.secretKey $old "SECRET_KEY" 48) }}
{{- $mechanicPassword := include "crapi.pick" (list .Values.credentials.mechanicDefaultPassword $old "MECHANIC_DEFAULT_PASSWORD" 20) }}
{{- $gatewayPassword := include "crapi.pick" (list .Values.credentials.apiGatewayPassword $old "API_GATEWAY_PASSWORD" 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  DB_PASSWORD: {{ $dbPassword | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ $mongoPassword | quote }}
  MONGO_DB_PASSWORD: {{ $mongoPassword | quote }}
  MH_MONGO_URI: {{ printf "%s:%s@%s:%v" .Values.mongodb.config.mongoUser $mongoPassword .Values.mongodb.service.name .Values.mongodb.port | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
  API_GATEWAY_PASSWORD: {{ $gatewayPassword | quote }}
  MECHANIC_DEFAULT_PASSWORD: {{ $mechanicPassword | quote }}
