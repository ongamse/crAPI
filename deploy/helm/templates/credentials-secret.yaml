{{- /*
Credentials are never committed. Values come from .Values.credentials (e.g.
--set credentials.dbPassword=...), else the existing in-cluster Secret (so
upgrades keep working), else a freshly generated random value.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.credentials.name) | default dict }}
{{- $existingData := get $existing "data" | default dict }}
{{- $dbPassword := .Values.credentials.dbPassword | default (get $existingData "DB_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
{{- $mongoPassword := .Values.credentials.mongoPassword | default (get $existingData "MONGO_DB_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
{{- $secretKey := .Values.credentials.secretKey | default (get $existingData "SECRET_KEY" | b64dec) | default (randAlphaNum 32) }}
{{- $gatewayPassword := .Values.credentials.apiGatewayPassword | default (get $existingData "API_GATEWAY_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.name }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ $dbPassword | quote }}
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  MONGO_DB_PASSWORD: {{ $mongoPassword | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ $mongoPassword | quote }}
  MH_MONGO_URI: {{ printf "%s:%s@%s:%v" .Values.mongodb.config.mongoUser $mongoPassword .Values.mongodb.service.name .Values.mongodb.port | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
  API_GATEWAY_PASSWORD: {{ $gatewayPassword | quote }}
