apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentialsName }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "postgresdb.config.postgresPassword must be set" .Values.postgresdb.config.postgresPassword | quote }}
  MONGO_DB_PASSWORD: {{ required "mongodb.config.mongoPassword must be set" .Values.mongodb.config.mongoPassword | quote }}
  SECRET_KEY: {{ required "workshop.config.secretKey must be set" .Values.workshop.config.secretKey | quote }}
  API_GATEWAY_PASSWORD: {{ required "apiGatewayPassword must be set" .Values.apiGatewayPassword | quote }}
  {{- if .Values.tlsEnabled }}
  TLS_KEYSTORE_PASSWORD: {{ required "identity.config.keyStorePassword must be set when tlsEnabled" .Values.identity.config.keyStorePassword | quote }}
  TLS_KEY_PASSWORD: {{ required "identity.config.keyPassword must be set when tlsEnabled" .Values.identity.config.keyPassword | quote }}
  {{- end }}
  {{- with .Values.chatbot.config.apiPassword }}
  API_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.workshop.config.mechanicSeedPassword }}
  MECHANIC_SEED_PASSWORD: {{ . | quote }}
  {{- end }}
