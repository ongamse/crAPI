apiVersion: v1
kind: Secret
metadata:
  name: crapi-credentials
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "credentials.dbPassword is required" .Values.credentials.dbPassword | quote }}
  MONGO_DB_PASSWORD: {{ required "credentials.mongoDbPassword is required" .Values.credentials.mongoDbPassword | quote }}
  SECRET_KEY: {{ required "credentials.secretKey is required" .Values.credentials.secretKey | quote }}
  API_GATEWAY_PASSWORD: {{ required "credentials.apiGatewayPassword is required" .Values.credentials.apiGatewayPassword | quote }}
  MECHANIC_SEED_PASSWORD: {{ required "credentials.mechanicSeedPassword is required" .Values.credentials.mechanicSeedPassword | quote }}
  API_PASSWORD: {{ required "credentials.chatbotApiPassword is required" .Values.credentials.chatbotApiPassword | quote }}
  {{- if .Values.tlsEnabled }}
  TLS_KEYSTORE_PASSWORD: {{ required "credentials.tlsKeystorePassword is required when tlsEnabled" .Values.credentials.tlsKeystorePassword | quote }}
  TLS_KEY_PASSWORD: {{ required "credentials.tlsKeyPassword is required when tlsEnabled" .Values.credentials.tlsKeyPassword | quote }}
  {{- else }}
  TLS_KEYSTORE_PASSWORD: ""
  TLS_KEY_PASSWORD: ""
  {{- end }}
