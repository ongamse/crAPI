# Credentials are never stored in values.yaml. Supply them at install time, e.g.
#   helm install crapi . --set postgresdb.config.postgresPassword=... \
#     --set mongodb.config.mongoPassword=... --set workshop.config.secretKey=... \
#     --set apiGatewayPassword=...
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentialsSecretName }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "postgresdb.config.postgresPassword must be set" .Values.postgresdb.config.postgresPassword | quote }}
  POSTGRES_PASSWORD: {{ required "postgresdb.config.postgresPassword must be set" .Values.postgresdb.config.postgresPassword | quote }}
  MONGO_DB_PASSWORD: {{ required "mongodb.config.mongoPassword must be set" .Values.mongodb.config.mongoPassword | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "mongodb.config.mongoPassword must be set" .Values.mongodb.config.mongoPassword | quote }}
  MH_MONGO_URI: {{ printf "%s:%s@%s:%v" .Values.mongodb.config.mongoUser (required "mongodb.config.mongoPassword must be set" .Values.mongodb.config.mongoPassword | urlquery) .Values.mongodb.service.name .Values.mongodb.port | quote }}
  SECRET_KEY: {{ required "workshop.config.secretKey must be set" .Values.workshop.config.secretKey | quote }}
  API_GATEWAY_PASSWORD: {{ required "apiGatewayPassword must be set" .Values.apiGatewayPassword | quote }}
