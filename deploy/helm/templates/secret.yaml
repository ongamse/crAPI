apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentialsSecretName }}
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgresdb.config.postgresPassword must be supplied at install time (--set or --values)" .Values.postgresdb.config.postgresPassword | quote }}
  DB_PASSWORD: {{ required "postgresdb.config.postgresPassword must be supplied at install time (--set or --values)" .Values.postgresdb.config.postgresPassword | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "mongodb.config.mongoPassword must be supplied at install time (--set or --values)" .Values.mongodb.config.mongoPassword | quote }}
  MONGO_DB_PASSWORD: {{ required "mongodb.config.mongoPassword must be supplied at install time (--set or --values)" .Values.mongodb.config.mongoPassword | quote }}
  MH_MONGO_URI: {{ printf "%s:%s@%s:%v" .Values.mongodb.config.mongoUser (required "mongodb.config.mongoPassword must be supplied at install time (--set or --values)" .Values.mongodb.config.mongoPassword) .Values.mongodb.service.name .Values.mongodb.port | quote }}
  SECRET_KEY: {{ required "workshop.config.secretKey must be supplied at install time (--set or --values)" .Values.workshop.config.secretKey | quote }}
  API_GATEWAY_PASSWORD: {{ required "apiGatewayPassword must be supplied at install time (--set or --values)" .Values.apiGatewayPassword | quote }}
  TLS_KEYSTORE_PASSWORD: {{ .Values.identity.config.keyStorePassword | default "" | quote }}
  TLS_KEY_PASSWORD: {{ .Values.identity.config.keyPassword | default "" | quote }}
  {{- if .Values.chatbot.config.apiPassword }}
  API_PASSWORD: {{ .Values.chatbot.config.apiPassword | quote }}
  {{- end }}
