{{- /*
TLS key pair for the crAPI web, community, workshop and chatbot workloads.
Nothing is stored in git: when `tlsEnabled` is true a self-signed certificate
and private key are generated once at install time and reused on upgrade. To
use your own certificate instead, create a kubernetes.io/tls Secret named
`tls.secretName` beforehand and set `tls.generate=false`.
*/ -}}
{{- if and .Values.tlsEnabled .Values.tls.generate }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.tls.secretName) | default dict }}
{{- $old := (get $existing "data") | default dict }}
{{- $dns := list "localhost" .Values.web.service.name .Values.identity.service.name .Values.community.service.name .Values.workshop.service.name .Values.chatbot.service.name }}
{{- $cert := dict }}
{{- if and (hasKey $old "tls.crt") (hasKey $old "tls.key") }}
{{- $_ := set $cert "Cert" (index $old "tls.crt" | b64dec) }}
{{- $_ := set $cert "Key" (index $old "tls.key" | b64dec) }}
{{- else }}
{{- $gen := genSelfSignedCert "crapi" (list "127.0.0.1") $dns 365 }}
{{- $_ := set $cert "Cert" $gen.Cert }}
{{- $_ := set $cert "Key" $gen.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.secretName }}
  labels:
    release: {{ .Release.Name }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ $cert.Cert | quote }}
  tls.key: {{ $cert.Key | quote }}
{{- end }}
