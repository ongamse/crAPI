{{- if (.Files.Glob .Values.identity.jwtKeySecret.file) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identity.jwtKeySecret.name }}
  labels:
    release: {{ .Release.Name }}
    {{- with .Values.identity.config.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  JWKS: {{ .Files.Get .Values.identity.jwtKeySecret.file | b64enc | b64enc | quote }}
{{- end }}
