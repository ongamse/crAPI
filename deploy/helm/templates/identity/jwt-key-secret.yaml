{{- /*
RSA signing key (JWKS json) for identity. It is never committed. Supply it with
either `--set-file secrets.jwksJson=jwks.json` or a git-ignored keys/jwks.json
next to values.yaml.
*/ -}}
{{- $jwksFile := .Files.Glob .Values.identity.jwtKeySecret.file -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identity.jwtKeySecret.name }}
  labels:
    release: {{ .Release.Name }}
    {{- with .Values.identity.config.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
{{- if .Values.secrets.jwksJson }}
stringData:
  jwks.json: {{ .Values.secrets.jwksJson | quote }}
{{- else if $jwksFile }}
data:
{{ $jwksFile.AsSecrets | indent 2 }}
{{- else }}
{{- fail "identity needs an RSA signing key: set secrets.jwksJson (--set-file secrets.jwksJson=jwks.json) or add keys/jwks.json to the chart" }}
{{- end }}
