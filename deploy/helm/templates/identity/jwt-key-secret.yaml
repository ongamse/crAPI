{{- $jwks := .Files.Glob .Values.identity.jwtKeySecret.file }}
{{- if not $jwks }}
{{- fail (printf "JWKS signing key %s not found: provide it at runtime (see docs/setup.md); it is not committed to the repo" .Values.identity.jwtKeySecret.file) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identity.jwtKeySecret.name }}
  labels:
    release: {{ .Release.Name }}
    {{- with .Values.identity.config.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
{{ $jwks.AsSecrets | indent 2 }}
