apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.identity.jwtKeySecret.name }}
  labels:
    release: {{ .Release.Name }}
    {{- with .Values.identity.config.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
{{- $jwks := .Files.Glob .Values.identity.jwtKeySecret.file }}
{{- if not $jwks }}
{{- fail (printf "JWKS key file %s not found: provide your own jwks.json (it is not stored in the repository)" .Values.identity.jwtKeySecret.file) }}
{{- end }}
{{ $jwks.AsSecrets | indent 2 }}
