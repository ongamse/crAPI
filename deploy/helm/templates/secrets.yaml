{{- /*
Credentials shared by the crAPI services. Values come from `.Values.secrets.*`
(set them with --set or a private values file); anything left empty is
generated randomly once and reused on upgrades. Nothing sensitive is committed.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "crapi-secrets") -}}
{{- $old := dict -}}
{{- if $existing -}}{{- $old = $existing.data | default dict -}}{{- end -}}
{{- define "crapi.secretValue" -}}
{{- $provided := index . 0 -}}
{{- $old := index . 1 -}}
{{- $key := index . 2 -}}
{{- if $provided -}}{{- $provided -}}
{{- else if hasKey $old $key -}}{{- index $old $key | b64dec -}}
{{- else -}}{{- randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
{{- $dbPassword := include "crapi.secretValue" (list .Values.secrets.postgresPassword $old "DB_PASSWORD") -}}
{{- $mongoPassword := include "crapi.secretValue" (list .Values.secrets.mongoPassword $old "MONGO_DB_PASSWORD") -}}
apiVersion: v1
kind: Secret
metadata:
  name: crapi-secrets
  labels:
    release: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ $dbPassword | quote }}
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  MONGO_DB_PASSWORD: {{ $mongoPassword | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ $mongoPassword | quote }}
  MH_MONGO_URI: {{ printf "%s:%s@%s:%v" .Values.mongodb.config.mongoUser $mongoPassword .Values.mongodb.service.name .Values.mongodb.port | quote }}
  JWT_SECRET: {{ include "crapi.secretValue" (list .Values.secrets.jwtSecret $old "JWT_SECRET") | quote }}
  SECRET_KEY: {{ include "crapi.secretValue" (list .Values.secrets.secretKey $old "SECRET_KEY") | quote }}
  API_GATEWAY_PASSWORD: {{ include "crapi.secretValue" (list .Values.secrets.apiGatewayPassword $old "API_GATEWAY_PASSWORD") | quote }}
  MECHANIC_SEED_PASSWORD: {{ include "crapi.secretValue" (list .Values.secrets.mechanicSeedPassword $old "MECHANIC_SEED_PASSWORD") | quote }}
  TLS_KEYSTORE_PASSWORD: {{ .Values.secrets.tlsKeystorePassword | default "" | quote }}
  TLS_KEY_PASSWORD: {{ .Values.secrets.tlsKeyPassword | default "" | quote }}
