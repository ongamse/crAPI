# Default values for crapi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1
imagePullPolicy: Always
apiGatewayServiceUrl: https://api.mypremiumdealership.com
apiGatewayServiceInstall: false
enableLog4j: true
enableShellInjection: true
tlsEnabled: true
# With TLS on, also pass --set identity.config.keyStorePassword=... --set identity.config.keyPassword=...
# Secret with the TLS private key (key name: server.key); create it before installing.
tlsKeyRef: crapi-tls-key

web:
  image: crapi/crapi-web
  port: 80
  sslPort: 443
identity:
  image: crapi/crapi-identity
  port: 8080
community:
  image: crapi/crapi-community
  port: 8087
workshop:
  image: crapi/crapi-workshop
  port: 8000
chatbot:
  image: crapi/crapi-chatbot
  port: 5002
mailhog:
  image: crapi/mailhog
mongodb:
  image: mongo
  version: 5.0
postgresdb:
  image: postgres
  version: 14
